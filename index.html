<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM MODA | Tienda Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,300;1,700;1,900&display=swap" rel="stylesheet">
    
    <style>
        :root { --brand-green: #6DAE5A; --brand-black: #080808; --brand-white: #ffffff; --ease-luxury: cubic-bezier(0.16, 1, 0.3, 1); }
        body { font-family: 'Urbanist', sans-serif; background: var(--brand-white); color: var(--brand-black); }
        .view-layer { display: none; } .view-layer.active { display: block; }
        .protected-img { pointer-events: none; user-select: none; }
        #search-input::placeholder { color: #a1a1aa; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="preloader" class="fixed inset-0 bg-black z-[9999] flex flex-col justify-center items-center transition-opacity duration-1000">
        <h2 class="text-white text-4xl font-black italic tracking-widest uppercase">LEM MODA</h2>
    </div>

    <nav class="fixed top-0 w-full z-50 p-8 flex justify-between items-center bg-white/80 backdrop-blur-md">
        <div class="logo-box cursor-pointer" onclick="goTo('home')"><img src="assets/images/logos/logo_lem-05.webp" alt="LEM MODA" class="h-8"></div>
        <div class="flex gap-8">
            <span onclick="goTo('shop')" class="text-[10px] font-black uppercase cursor-pointer">Colección</span>
            <span onclick="toggleCartDrawer()" class="cursor-pointer">🛒</span>
        </div>
    </nav>

    <main id="shop" class="view-layer pt-32 pb-20">
        <div class="max-w-7xl mx-auto px-8">
            <h2 class="text-6xl font-black italic uppercase mb-12">Tienda<span class="text-[#6DAE5A]">.</span></h2>
            
            <div class="mb-12">
                <input type="text" id="search-input" placeholder="Buscar piezas..." 
                       onkeyup="filterProducts()" 
                       class="w-full p-4 border border-zinc-200 focus:border-black outline-none transition-all uppercase text-[10px] tracking-widest">
            </div>

            <div id="grid-mount" class="grid grid-cols-2 md:grid-cols-4 gap-8"></div>
        </div>
    </main>

    <script>
        /* 30 PRODUCTOS MAESTROS */
        const MOCK_DB = [
            { id: 1, name: "Industrial Boxy Tee", price: 40, category: "hombre", img: "assets/img/1.webp" },
            { id: 2, name: "Minimalist Hoodie", price: 75, category: "hombre", img: "assets/img/2.webp" },
            { id: 3, name: "Boxy Tech Pants", price: 85, category: "hombre", img: "assets/img/3.webp" },
            { id: 4, name: "Luxury Fleece", price: 90, category: "hombre", img: "assets/img/4.webp" },
            { id: 5, name: "Raw Edge Tee", price: 38, category: "hombre", img: "assets/img/5.webp" },
            { id: 6, name: "Athleisure Windbreaker", price: 110, category: "hombre", img: "assets/img/6.webp" },
            { id: 7, name: "Ribbed Mockneck", price: 65, category: "hombre", img: "assets/img/7.webp" },
            { id: 8, name: "Asymmetric Zip Top", price: 55, category: "mujer", img: "assets/img/8.webp" },
            { id: 9, name: "Cargo Leggings", price: 70, category: "mujer", img: "assets/img/9.webp" },
            { id: 10, name: "Boyfriend Blazer", price: 135, category: "mujer", img: "assets/img/10.webp" },
            { id: 11, name: "Terry Crop Pullover", price: 60, category: "mujer", img: "assets/img/11.webp" },
            { id: 12, name: "Fluid Tech Joggers", price: 80, category: "mujer", img: "assets/img/12.webp" },
            { id: 13, name: "Knit Comfort Set", price: 120, category: "outfits", img: "assets/img/13.webp" },
            { id: 14, name: "Urban Master-Outfit", price: 150, category: "outfits", img: "assets/img/14.webp" },
            { id: 15, name: "Cyber Avant-Garde", price: 195, category: "outfits", img: "assets/img/15.webp" },
            { id: 16, name: "Sage Promo Sweat", price: 45, category: "promociones", img: "assets/img/16.webp" },
            { id: 17, name: "Sand Oversized Tee", price: 35, category: "promociones", img: "assets/img/17.webp" },
            { id: 18, name: "Pink Leaf Hoodie", price: 70, category: "promociones", img: "assets/img/18.webp" },
            { id: 19, name: "Terra Master-Piece", price: 60, category: "promociones", img: "assets/img/19.webp" },

            { id: 21, name: "Tech Vest", price: 95, category: "hombre", img: "assets/img/21.webp" },
            { id: 22, name: "Minimalist Scarf", price: 25, category: "hombre", img: "assets/img/22.webp" },
            { id: 23, name: "Premium Cap", price: 20, category: "hombre", img: "assets/img/23.webp" },
            { id: 24, name: "Luxury Socks 3pk", price: 15, category: "hombre", img: "assets/img/24.webp" },

            { id: 26, name: "Structured Tote", price: 45, category: "mujer", img: "assets/img/26.webp" },
            { id: 27, name: "Basic Seamless Legging", price: 50, category: "mujer", img: "assets/img/27.webp" },
            { id: 28, name: "Reflective Anorak", price: 140, category: "outfits", img: "assets/img/28.webp" },
            { id: 29, name: "Essential Lounge Set", price: 110, category: "outfits", img: "assets/img/29.webp" },
            { id: 30, name: "Last Season Crew", price: 30, category: "promociones", img: "assets/img/30.webp" }
        ];

        /* LÓGICA DE FILTRADO Y BÚSQUEDA INTELIGENTE */
        function filterProducts() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filtered = MOCK_DB.filter(p => p.name.toLowerCase().includes(searchTerm));
            renderGrid(filtered);
        }

        function renderGrid(data) {
            const container = document.getElementById('grid-mount');
            container.innerHTML = data.map(p => `
                <div class="product-card group cursor-pointer">
                    <div class="img-container bg-zinc-100 mb-4 overflow-hidden">
                        <img src="${p.img}" class="protected-img w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                    </div>
                    <h3 class="text-[9px] font-black uppercase tracking-widest">${p.name}</h3>
                    <p class="text-[9px] text-zinc-400">$${p.price.toFixed(2)}</p>
                </div>
            `).join('');
        }

        function goTo(viewId) {
            document.querySelectorAll('.view-layer').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function toggleCartDrawer() { /* Tu lógica de carrito aquí */ }

        window.onload = () => {
            renderGrid(MOCK_DB);
            setTimeout(() => document.getElementById('preloader').style.opacity = '0', 800);
        };
    </script>
</body>
</html>
