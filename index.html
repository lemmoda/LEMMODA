<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="LEM MODA - División de Streetwear de Alta Gama | Ecuador">
    <title>LEM MODA | Tienda Oficial</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100;0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-green: #6DAE5A;
            --brand-black: #080808;
            --brand-white: #ffffff;
            --brand-zinc: #f4f4f5;
            --ease-luxury: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Urbanist', sans-serif;
            background: var(--brand-white);
            color: var(--brand-black);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- PANTALLA DE CARGA --- */
        #preloader {
            position: fixed; inset: 0;
            background: var(--brand-black); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s var(--ease-luxury);
        }

        .loader-line {
            width: 120px; height: 1px; background: rgba(255,255,255,0.1);
            margin-top: 24px; position: relative; overflow: hidden;
        }

        .loader-fill {
            position: absolute; width: 0%; height: 100%; background: var(--brand-green);
            animation: fillProgress 2s var(--ease-luxury) forwards;
        }

        @keyframes fillProgress { to { width: 100%; } }

        /* --- NAVEGACIÓN --- */
        .nav-master {
            position: fixed; top: 0; width: 100%; z-index: 5000;
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.6s var(--ease-luxury);
        }

        @media (min-width: 1024px) {
            .nav-master { padding: 30px 60px; }
        }

        .nav-master.scrolled {
            padding: 15px 30px; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo-box img { height: 32px; width: auto; object-fit: contain; }

        /* --- MOTOR DE VISTAS --- */
        .view-layer {
            display: none; opacity: 0; transform: translateY(20px);
            transition: opacity 0.8s var(--ease-luxury), transform 0.8s var(--ease-luxury);
        }

        .view-layer.active { display: block; opacity: 1; transform: translateY(0); }

        /* --- CATÁLOGO --- */
        .catalogue-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; padding: 15px;
        }

        @media (min-width: 1024px) {
            .catalogue-grid { grid-template-columns: repeat(4, 1fr); gap: 40px; padding: 60px; }
        }

        .product-card { 
            opacity: 0; transform: translateY(30px);
            animation: revealUp 0.8s var(--ease-luxury) forwards;
        }

        @keyframes revealUp { to { opacity: 1; transform: translateY(0); } }

        .img-container {
            width: 100%; aspect-ratio: 3/4; overflow: hidden;
            background: var(--brand-zinc); border-radius: 2px;
            position: relative;
        }

        .img-container img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 1.5s var(--ease-luxury), opacity 0.8s var(--ease-luxury);
            opacity: 0;
        }

        .img-container img.loaded { opacity: 1; }

        /* --- CORRECCIÓN DE TALLAS (ALTA DEFINICIÓN) --- */
        .size-btn {
            width: 48px; height: 56px; border: 1px solid #e4e4e7;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            background: #fff;
        }

        .size-num {
            font-size: 8px; font-weight: 600; color: #71717a; 
            letter-spacing: 0.8px; margin-bottom: 2px;
            text-rendering: optimizeLegibility;
        }

        .size-let {
            font-size: 13px; font-weight: 800; color: #000;
            text-rendering: optimizeLegibility;
        }

        .size-btn:hover { border-color: #a1a1aa; background: #fafafa; }

        .size-btn.active { background: #000; border-color: #000; }
        .size-btn.active .size-num { color: rgba(255,255,255,0.7); }
        .size-btn.active .size-let { color: #fff; }

        /* --- COLORES --- */
        .color-dot {
            width: 24px; height: 24px; border-radius: 50%;
            cursor: pointer; border: 1px solid rgba(0,0,0,0.1);
            transition: 0.3s var(--ease-luxury);
        }
        .color-dot.active { border: 2px solid #000; transform: scale(1.15); }

        .add-to-cart-trigger {
            width: 100%; padding: 18px; background: #000; color: #fff;
            font-size: 10px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.5s var(--ease-luxury);
            margin-top: 15px;
        }

        .add-to-cart-trigger:hover { background: var(--brand-green); }

        /* --- CARRITO & MODAL --- */
        #product-modal {
            position: fixed; inset: 0; background: #fff; z-index: 7000;
            display: none; opacity: 0; transition: all 0.5s var(--ease-luxury);
        }
        #product-modal.open { display: block; opacity: 1; }

        #cart-sidebar {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 480px;
            height: 100vh; background: #fff; z-index: 6000;
            box-shadow: -30px 0 60px rgba(0,0,0,0.05);
            transition: right 0.8s var(--ease-luxury);
            display: flex; flex-direction: column; padding: 30px;
        }

        #cart-sidebar.open { right: 0; }

        /* --- FOOTER MOVIL --- */
        .mobile-footer {
            display: flex; position: fixed; bottom: 0; width: 100%;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
            z-index: 4000; padding: 15px; justify-content: space-around;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        @media (min-width: 1024px) { .mobile-footer { display: none; } }
    </style>
</head>
<body>

    <div id="preloader">
        <h2 class="text-white text-3xl font-black italic tracking-tighter uppercase">LEM MODA</h2>
        <div class="loader-line"><div class="loader-fill"></div></div>
    </div>

    <nav class="nav-master" id="header-nav">
        <div class="logo-box cursor-pointer" onclick="goTo('home')">
            <span class="text-2xl font-black italic tracking-tighter uppercase">LEM <span class="text-[#6DAE5A]">MODA</span></span>
        </div>
        
        <button onclick="toggleCartDrawer()" class="relative group">
            <span class="text-2xl">🛒</span>
            <span id="cart-badge" class="absolute -top-2 -right-2 bg-[#6DAE5A] text-white text-[9px] w-5 h-5 rounded-full flex items-center justify-center font-black">0</span>
        </button>
    </nav>

    <div class="mobile-footer" id="mobile-nav">
        <span onclick="goTo('home')" class="text-[9px] font-black uppercase tracking-widest">Inicio</span>
        <span onclick="goTo('shop')" class="text-[9px] font-black uppercase tracking-widest">Tienda</span>
    </div>

    <main id="home" class="view-layer active">
        <div class="relative h-[100vh] w-full bg-black flex items-center justify-center overflow-hidden">
            <div class="relative z-10 text-center text-white px-6">
                <h1 class="text-6xl md:text-[12rem] font-black italic uppercase leading-[0.8] tracking-tighter mb-12">
                    Mística<br><span class="text-[#6DAE5A]">Urbana</span>
                </h1>
                <button onclick="goTo('shop')" class="bg-white text-black px-12 py-5 rounded-full font-black uppercase text-[10px] tracking-[0.5em] hover:bg-[#6DAE5A] hover:text-white transition-all">
                    Explorar Catálogo
                </button>
            </div>
        </div>
    </main>

    <main id="shop" class="view-layer pt-32 pb-32">
        <div class="max-w-[1800px] mx-auto px-6">
            <div id="grid-mount" class="catalogue-grid"></div>
        </div>
    </main>

    <aside id="cart-sidebar">
        <div class="flex justify-between items-center mb-10">
            <h3 class="text-3xl font-black italic uppercase tracking-tighter">Mi Bolsa</h3>
            <button onclick="toggleCartDrawer()" class="text-xl">✕</button>
        </div>
        <div id="cart-list" class="flex-grow overflow-y-auto"></div>
        <div class="pt-6 border-t border-zinc-100">
            <div class="flex justify-between mb-6">
                <span class="text-[10px] font-black uppercase text-zinc-400">Total</span>
                <span id="cart-total" class="text-3xl font-black">$0.00</span>
            </div>
            <button onclick="sendOrder()" class="w-full bg-black text-white py-6 font-black uppercase text-[10px] tracking-widest">Finalizar Pedido</button>
        </div>
    </aside>

    <script>
        const MOCK_DB = [
            { id: 5, name: "Grey Urban Core", price: 90, img: "1000813671.webp", category: "hombre" },
            { id: 6, name: "Essential White Tee", price: 38, img: "1000813673.webp", category: "hombre" }
        ];

        const COLOR_PALETTE = [
            { code: "#FDFCF0", name: "Crema Hueso" },
            { code: "#E5E7E9", name: "Gris Nube" },
            { code: "#D5DBDB", name: "Verde Salvia" },
            { code: "#FADBD8", name: "Rosa Ceniza" },
            { code: "#D6EAF8", name: "Azul Bruma" }
        ];

        const SIZE_GUIDE = [
            { let: 'XS', num: '32-34' },
            { let: 'S', num: '36-38' },
            { let: 'M', num: '40-42' },
            { let: 'L', num: '44-46' },
            { let: 'XL', num: '48-50' }
        ];

        let cart = JSON.parse(localStorage.getItem('lem_cart')) || [];

        function goTo(id) {
            document.querySelectorAll('.view-layer').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
            if(id === 'shop') mountShop();
            document.getElementById('mobile-nav').style.transform = (id === 'home') ? 'translateY(100%)' : 'translateY(0)';
        }

        function mountShop() {
            const container = document.getElementById('grid-mount');
            container.innerHTML = MOCK_DB.map((p, index) => `
                <div class="product-card" style="animation-delay: ${index * 0.1}s">
                    <div class="img-container">
                        <img src="${p.img}" alt="${p.name}" onload="this.classList.add('loaded')">
                    </div>
                    <div class="py-6">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-[11px] font-black uppercase italic w-2/3">${p.name}</h3>
                            <span class="text-[12px] font-black text-[#6DAE5A]">$${p.price.toFixed(2)}</span>
                        </div>
                        
                        <div class="flex flex-wrap gap-2 mb-4" id="sizes-${p.id}">
                            ${SIZE_GUIDE.map(s => `
                                <div class="size-btn" onclick="setUISize(this)">
                                    <span class="size-num">${s.num}</span>
                                    <span class="size-let">${s.let}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="flex gap-2.5 mb-6" id="colors-${p.id}">
                            ${COLOR_PALETTE.map(c => `
                                <div class="color-dot" 
                                     style="background-color: ${c.code}" 
                                     onclick="setUIColor(this, '${c.name}', 'colors-${p.id}')">
                                </div>
                            `).join('')}
                        </div>

                        <button onclick="addToCart(${p.id}, 'sizes-${p.id}', 'colors-${p.id}')" class="add-to-cart-trigger">
                            Añadir a Bolsa
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function setUISize(el) {
            el.parentElement.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function setUIColor(el, name, containerId) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            container.dataset.selected = name;
        }

        function toggleCartDrawer() {
            document.getElementById('cart-sidebar').classList.toggle('open');
        }

        function addToCart(id, sizeId, colorId) {
            const sizeEl = document.querySelector(`#${sizeId} .active`);
            const color = document.getElementById(colorId).dataset.selected;
            
            if(!sizeEl || !color) return alert("Selecciona talla y color");
            
            const p = MOCK_DB.find(item => item.id === id);
            cart.push({ ...p, size: sizeEl.querySelector('.size-let').innerText, color });
            localStorage.setItem('lem_cart', JSON.stringify(cart));
            renderCart();
            toggleCartDrawer();
        }

        function renderCart() {
            document.getElementById('cart-badge').innerText = cart.length;
            const container = document.getElementById('cart-list');
            container.innerHTML = cart.map((item, i) => `
                <div class="flex gap-4 mb-6">
                    <img src="${item.img}" class="w-16 h-20 object-cover">
                    <div class="flex-grow">
                        <h4 class="text-[10px] font-black uppercase italic">${item.name}</h4>
                        <p class="text-[9px] text-zinc-400 font-bold mt-1">${item.size} | ${item.color}</p>
                    </div>
                </div>
            `).join('');
            const total = cart.reduce((acc, p) => acc + p.price, 0);
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function sendOrder() {
            let text = "⚜️ LEM MODA | ORDEN ⚜️\n\n";
            cart.forEach(p => text += `• ${p.name} (${p.size}/${p.color}) - $${p.price}\n`);
            window.open(`https://wa.me/593984909967?text=${encodeURIComponent(text)}`);
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('preloader').style.opacity = '0';
                setTimeout(() => document.getElementById('preloader').style.display = 'none', 1000);
            }, 1500);
            renderCart();
        };
    </script>
</body>
</html>
